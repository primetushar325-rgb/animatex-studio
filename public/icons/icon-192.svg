<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="96" cy="96" r="88" fill="url(#bgGrad)"/>
  
  <!-- Inner shadow ring -->
  <circle cx="96" cy="96" r="76" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
  
  <!-- Film strip holes - left -->
  <rect x="23" y="58" width="15" height="15" rx="2" fill="rgba(255,255,255,0.3)"/>
  <rect x="23" y="81" width="15" height="15" rx="2" fill="rgba(255,255,255,0.3)"/>
  <rect x="23" y="104" width="15" height="15" rx="2" fill="rgba(255,255,255,0.3)"/>
  
  <!-- Film strip holes - right -->
  <rect x="154" y="58" width="15" height="15" rx="2" fill="rgba(255,255,255,0.3)"/>
  <rect x="154" y="81" width="15" height="15" rx="2" fill="rgba(255,255,255,0.3)"/>
  <rect x="154" y="104" width="15" height="15" rx="2" fill="rgba(255,255,255,0.3)"/>
  
  <!-- Play button -->
  <path d="M80 61 L80 131 L138 96 Z" fill="url(#playGrad)"/>
  
  <!-- Sparkles -->
  <circle cx="58" cy="42" r="6" fill="white" opacity="0.8"/>
  <circle cx="144" cy="144" r="4" fill="white" opacity="0.6"/>
  <circle cx="150" cy="48" r="5" fill="white" opacity="0.7"/>
</svg>
